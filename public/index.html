<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 커스텀 타이틀바 */
        .titlebar {
            height: 30px;
            background: #323233;
            display: flex;
            align-items: center;
            justify-content: space-between;
            -webkit-app-region: drag;
            user-select: none;
            border-bottom: 1px solid #2d2d2d;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        .titlebar-title {
            font-size: 12px;
            color: #cccccc;
            margin-left: 8px;
        }

        .titlebar-menu {
            display: flex;
            -webkit-app-region: no-drag;
        }

        .titlebar-menu-item {
            padding: 4px 10px;
            font-size: 12px;
            color: #cccccc;
            cursor: pointer;
            transition: background 0.2s;
        }

        .titlebar-menu-item:hover {
            background: #3e3e42;
        }

        .titlebar-controls {
            display: flex;
            -webkit-app-region: no-drag;
        }

        .titlebar-button {
            width: 46px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 10px;
            color: #cccccc;
        }

        .titlebar-button:hover {
            background: #3e3e42;
        }

        .titlebar-button.close:hover {
            background: #e81123;
            color: white;
        }

        .app-container {
            display: flex;
            flex: 1;
            width: 100vw;
        }

        /* 왼쪽 아이콘 메뉴바 */
        .activity-bar {
            width: 48px;
            background: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            border-right: 1px solid #2d2d2d;
        }

        .activity-bar-item {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            color: #858585;
            transition: color 0.2s;
        }

        .activity-bar-item:hover {
            color: #ffffff;
        }

        .activity-bar-item.active {
            color: #ffffff;
        }

        .activity-bar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: #007acc;
        }

        .activity-bar-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* 사이드바 (Explorer) */
        .sidebar {
            width: 250px;
            background: #252526;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d2d;
        }

        .sidebar-header {
            padding: 10px 15px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #cccccc;
            letter-spacing: 0.5px;
            background: #252526;
            border-bottom: 1px solid #2d2d2d;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        /* 파일 트리 */
        .tree-item {
            padding: 4px 8px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .tree-item:hover {
            background: #2a2d2e;
        }

        .tree-item.selected {
            background: #37373d;
        }

        .tree-item-icon {
            margin-right: 6px;
            display: inline-block;
            width: 16px;
            text-align: center;
        }

        .tree-item-label {
            font-size: 13px;
            color: #cccccc;
        }

        .tree-item.folder {
            font-weight: 500;
        }

        .tree-item-children {
            display: none;
        }

        .tree-item-children.expanded {
            display: block;
        }

        /* 메인 에디터 영역 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            overflow: hidden;
        }

        .editor-tabs {
            display: flex;
            background: #2d2d2d;
            border-bottom: 1px solid #2d2d2d;
            min-height: 35px;
        }

        .editor-tab {
            padding: 8px 20px;
            background: #2d2d2d;
            border-right: 1px solid #1e1e1e;
            cursor: pointer;
            font-size: 13px;
            color: #969696;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-tab.active {
            background: #1e1e1e;
            color: #ffffff;
        }

        .editor-tab:hover {
            color: #ffffff;
        }

        .editor-area {
            flex: 1;
            padding: 20px;
            overflow: auto;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .welcome-screen h1 {
            font-size: 36px;
            color: #cccccc;
            margin-bottom: 20px;
        }

        .welcome-screen p {
            font-size: 14px;
            color: #858585;
            margin-bottom: 10px;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e4e;
        }

        .chevron {
            display: inline-block;
            margin-right: 4px;
            transition: transform 0.2s;
        }

        .chevron.expanded {
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <!-- 커스텀 타이틀바 -->
    <div class="titlebar">
        <div class="titlebar-left">
            <div class="titlebar-title">Code Editor</div>
            <div class="titlebar-menu">
                <div class="titlebar-menu-item">File</div>
                <div class="titlebar-menu-item">Edit</div>
                <div class="titlebar-menu-item">Selection</div>
                <div class="titlebar-menu-item" onclick="toggleDevTools()">View</div>
                <div class="titlebar-menu-item">Go</div>
                <div class="titlebar-menu-item">Run</div>
                <div class="titlebar-menu-item">Terminal</div>
                <div class="titlebar-menu-item">Help</div>
            </div>
        </div>
        <div class="titlebar-controls">
            <div class="titlebar-button minimize" onclick="minimizeWindow()">
                <span>―</span>
            </div>
            <div class="titlebar-button maximize" onclick="maximizeWindow()">
                <span>□</span>
            </div>
            <div class="titlebar-button close" onclick="closeWindow()">
                <span>✕</span>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- 왼쪽 아이콘 메뉴바 -->
        <div class="activity-bar">
            <div class="activity-bar-item active" data-view="explorer" title="Explorer">
                <svg viewBox="0 0 16 16">
                    <path d="M14.5 2H7.71l-.85-.85L6.51 1h-5l-.5.5v11l.5.5h13l.5-.5v-10L14.5 2zm-.51 8.49V13h-12V7h4.49l.35-.15.86-.86H14v4.5z"/>
                </svg>
            </div>
            <div class="activity-bar-item" data-view="search" title="Search">
                <svg viewBox="0 0 16 16">
                    <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04z"/>
                </svg>
            </div>
            <div class="activity-bar-item" data-view="git" title="Source Control">
                <svg viewBox="0 0 16 16">
                    <path d="M7.5 1L1 7.5 7.5 14 14 7.5 7.5 1zM7.5 12.5L2.5 7.5 7.5 2.5l5 5-5 5z"/>
                </svg>
            </div>
            <div class="activity-bar-item" data-view="extensions" title="Extensions">
                <svg viewBox="0 0 16 16">
                    <path d="M2 2l4-1v12l-4 1V2zm5-1l4 1v12l-4-1V1zm5 1l4-1v12l-4 1V2z"/>
                </svg>
            </div>
        </div>

        <!-- 사이드바 (Explorer) -->
        <div class="sidebar">
            <div class="sidebar-header">
                Explorer
            </div>
            <div class="sidebar-content" id="explorer">
                <div class="tree-item folder" data-type="folder" data-name="project-root">
                    <span class="chevron">▶</span>
                    <span class="tree-item-icon">📁</span>
                    <span class="tree-item-label">MY PROJECT</span>
                </div>
                <div class="tree-item-children" id="project-root-children">
                    <div class="tree-item folder" data-type="folder" data-name="src">
                        <span class="chevron">▶</span>
                        <span class="tree-item-icon">📁</span>
                        <span class="tree-item-label">src</span>
                    </div>
                    <div class="tree-item-children" id="src-children">
                        <div class="tree-item file" data-file="src/main.ts">
                            <span class="tree-item-icon">📄</span>
                            <span class="tree-item-label">main.ts</span>
                        </div>
                        <div class="tree-item file" data-file="src/preload.ts">
                            <span class="tree-item-icon">📄</span>
                            <span class="tree-item-label">preload.ts</span>
                        </div>
                    </div>
                    <div class="tree-item folder" data-type="folder" data-name="public">
                        <span class="chevron">▶</span>
                        <span class="tree-item-icon">📁</span>
                        <span class="tree-item-label">public</span>
                    </div>
                    <div class="tree-item-children" id="public-children">
                        <div class="tree-item file" data-file="public/index.html">
                            <span class="tree-item-icon">📄</span>
                            <span class="tree-item-label">index.html</span>
                        </div>
                        <div class="tree-item file" data-file="public/renderer.js">
                            <span class="tree-item-icon">📄</span>
                            <span class="tree-item-label">renderer.js</span>
                        </div>
                    </div>
                    <div class="tree-item file" data-file="package.json">
                        <span class="tree-item-icon">📦</span>
                        <span class="tree-item-label">package.json</span>
                    </div>
                    <div class="tree-item file" data-file="tsconfig.json">
                        <span class="tree-item-icon">⚙️</span>
                        <span class="tree-item-label">tsconfig.json</span>
                    </div>
                    <div class="tree-item file" data-file="README.md">
                        <span class="tree-item-icon">📝</span>
                        <span class="tree-item-label">README.md</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 메인 에디터 영역 -->
        <div class="main-content">
            <div class="editor-tabs" id="editorTabs">
                <div class="editor-tab active">
                    <span>Welcome</span>
                </div>
            </div>
            <div class="editor-area">
                <div class="welcome-screen">
                    <h1>Code Editor</h1>
                    <p>Electron + TypeScript 기반 에디터</p>
                    <p>왼쪽 Explorer에서 파일을 선택하세요</p>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
